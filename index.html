<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에코스섬의 비밀</title>
<style>
  @font-face {
    font-family: 'OneStoreMobilePop';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/ONE-Mobile-POP.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  /* ===== Banner ===== */
  .banner {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #313131;
  }

  .bgPicture {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  /* Fixed 1920:1080 canvas that always covers .bgPicture, same crop
     behavior as object-fit:cover, so every layer below lines up. */
  .scene {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 1920 / 1080;
    min-width: 100%;
    min-height: 100%;
  }

  .bgImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .titleImage {
    position: absolute;
    left: 33.1%;
    top: 15.30%;
    width: 36.21%;
    height: 16.18%;
  }

  .planetLeft {
    position: absolute;
    left: 8.2%;
    top: 17%;
    width: 11.93%;
    height: auto;
    animation: floatPlanet 4s ease-in-out infinite;
  }

  .planetRight {
    position: absolute;
    left: 75.4%;
    top: 24.3%;
    width: 8.59%;
    height: auto;
    animation: floatPlanet 4.7s ease-in-out infinite;
    animation-delay: -2s;
  }

  @keyframes floatPlanet {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-28px) rotate(3deg); }
  }

  /* ===== Footer bar ===== */
  .footer {
    flex-shrink: 0;
    background-color: #313131;
    height: clamp(60px, 10vh, 96px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    z-index: 10;
    box-sizing: border-box;
  }

  .logo {
    height: clamp(22px, 3.5vh, 40px);
    width: auto;
    object-fit: contain;
  }

  /* ===== Buttons ===== */
  .buttons {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.2vw, 16px);
    margin-right: 10vw;
  }

  .btnManual,
  .btnStart {
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'OneStoreMobilePop', 'Noto Sans KR', sans-serif;
    font-weight: normal;
    font-size: clamp(12px, 1.3vw, 18px);
    letter-spacing: -0.03em; /* -3% per Figma spec */
    padding: clamp(6px, 1vh, 10px) clamp(14px, 2vw, 28px);
    transition: transform 0.15s ease, filter 0.15s ease;
    white-space: nowrap;
    color: #ffffff;
  }

  .btnManual:hover,
  .btnStart:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
  }

  .btnManual:active,
  .btnStart:active {
    transform: scale(0.97);
  }

  .btnManual {
    background-color: #9254df;
  }

  .btnStart {
    background-color: #419ff2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== Ultra-wide: >=3441px ===== */
  @media (min-width: 3441px) {
    .footer {
      padding: 0 29.6%;
    }
  }

  /* ===== Select screen (after START) ===== */
  .page {
    width: 100%;
    height: 100vh;
  }

  .page[hidden] {
    display: none;
  }

  .selectStage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000622;
  }

  .selectScene {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 1920 / 1080;
    min-width: 100%;
    min-height: 100%;
  }


  .selectBg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .selectRocket {
    position: absolute;
    left: 8.3%;
    top: 9%;
    width: 13.11%;  /* 20% smaller, anchored at same top-left */
    height: 20.67%;
    animation: floatRocket 3.5s ease-in-out infinite;
  }

  @keyframes floatRocket {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -14px; }
  }

  .lockBubble {
    position: absolute;
    width: 11.60%;  /* 222.69 / 1920, per Figma spec */
    height: 23.13%; /* corrected to native 279:313 circle ratio */
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .lockBubble:hover {
    transform: scale(1.08);
    filter: brightness(1.15);
  }

  .bubble1 { left: 27.34%; top: 16.67%; }
  .bubble2 { left: 14.18%; top: 33.45%; }
  .bubble3 { left: 29.09%; top: 56.90%; }
  .bubble4 { left: 42.79%; top: 36.86%; }
  .bubble5 { left: 58.96%; top: 16.67%; }
  .bubble6 { left: 72.85%; top: 33.45%; }
  .bubble7 { left: 62.19%; top: 56.90%; }

  .connector { position: absolute; object-fit: contain; }
  .conn-1-2 { left: 25.10%; top: 36.37%; width: 2.917%; height: 3.796%; }
  .conn-2-3 { left: 24.57%; top: 52.14%; width: 5.729%; height: 12.5%; }
  .conn-3-4 { left: 39.68%; top: 57.36%; width: 4.115%; height: 5.463%; }
  .conn-4-5 { left: 53.45%; top: 35.99%; width: 6.458%; height: 7.963%; }
  .conn-5-6 { left: 69.91%; top: 34.38%; width: 3.594%; height: 7.778%; }
  .conn-6-7 { left: 71.32%; top: 55.89%; width: 4.010%; height: 5.0%; }

  #lock1.active { left: 26.72%; top: 15.76%; width: 12.84%; height: 25.24%; }
  #conn12.active { left: 25.10%; top: 36.37%; width: 2.917%; height: 3.796%; }

  #lock2.active { left: 13.56%; top: 32.54%; width: 12.84%; height: 25.24%; }
  #conn23.active { left: 24.57%; top: 52.14%; width: 5.729%; height: 12.5%; }

  #lock3.active { left: 28.47%; top: 55.99%; width: 12.84%; height: 25.24%; }
  #conn34.active { left: 39.68%; top: 57.36%; width: 4.115%; height: 5.463%; }

  #lock4.active { left: 42.17%; top: 35.95%; width: 12.84%; height: 25.24%; }
  #conn45.active { left: 53.45%; top: 35.99%; width: 6.458%; height: 7.963%; }

  #lock5.active { left: 58.34%; top: 15.76%; width: 12.84%; height: 25.24%; }
  #conn56.active { left: 69.91%; top: 34.38%; width: 3.594%; height: 7.778%; }

  #lock6.active { left: 72.23%; top: 32.54%; width: 12.84%; height: 25.24%; }
  #conn67.active { left: 71.32%; top: 55.89%; width: 4.010%; height: 5.0%; }

  #lock7.active { left: 61.57%; top: 55.99%; width: 12.84%; height: 25.24%; }

  .stageRocket {
    position: absolute;
    display: none;
    width: 10%;
    height: auto;
    pointer-events: none;
    z-index: 5;
  }
  .stageRocket.active {
    display: block;
    animation: floatRocket 3.5s ease-in-out infinite;
  }

  .rocket-at-1 { left: 34.5%; top: 13%; transform: rotate(-5deg); }
  .rocket-at-2 { left: 7%; top: 40%; transform: scaleX(-1) rotate(3deg); }
  .rocket-at-3 { left: 22%; top: 65%; transform: rotate(-3deg); }
  .rocket-at-4 { left: 51%; top: 40%; transform: rotate(6deg); }
  .rocket-at-5 { left: 66%; top: 15%; transform: rotate(0deg); }
  .rocket-at-6 { left: 82%; top: 35%; transform: scaleX(-1) rotate(5deg); }
  .rocket-at-7 { left: 79%; top: 62%; width: 14%; transform: rotate(-2deg); }

  .selectManualBtn {
    position: absolute;
    left: 85.74%;
    top: 8.5%;
    width: 9.828%;  /* 15% smaller than Figma spec */
    height: 5.194%;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .selectManualBtn:hover {
    transform: scale(1.08);
    filter: brightness(1.15);
  }

  .certBtn {
    position: absolute;
    width: 9.695%;  /* 15% smaller than Figma spec */
    height: 4.958%;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .certBtn:hover {
    transform: scale(1.08);
    filter: brightness(1.15);
  }

  .cert1 { left: 30.04%; top: 81%; }
  .cert2 { left: 63.64%; top: 81%; }

  /* Tablet range only: scale the whole scene as one unit so every element
     keeps its exact relative position (same layout as PC, just smaller) */
  @media (min-width: 700px) and (max-width: 1400px) {
    .selectScene {
      transform: translate(-50%, -50%) scale(0.85);
    }
    .selectManualBtn {
      left: 80%;
    }
  }
</style>
</head>
<body>

  <div class="page" id="page-main">
    <div class="banner">
      <div class="bgPicture">
        <div class="scene">
          <img src="images/메인화면 복사 1.png" alt="" class="bgImage">
          <img src="images/메인화면_1 1.png" alt="" class="planetLeft">
          <img src="images/메인화면_2 2.png" alt="" class="planetRight">
          <img src="images/Group (4).png" alt="에코스 섬의 비밀" class="titleImage">
        </div>
      </div>

      <footer class="footer">
        <img src="images/이솜로고.png" alt="이솜 EBS 소프트웨어 x VRWARE" class="logo">
        <div class="buttons">
          <button type="button" class="btnManual">매뉴얼 다운로드</button>
          <button type="button" class="btnStart" id="btn-start">START</button>
        </div>
      </footer>
    </div>
  </div>

  <div class="page" id="page-select" hidden>
    <div class="selectStage">
      <div class="selectScene">
        <img src="images/image 2482.png" alt="" class="selectBg">
        <img src="images/기본 연결/Group 1000014010.png" alt="" class="connector conn-1-2" id="conn12">

        <img src="images/기본 연결/Group 1000014010 (1).png" alt="" class="connector conn-2-3" id="conn23">
        <img src="images/기본 연결/Group 1000014010 (4).png" alt="" class="connector conn-3-4" id="conn34">
        <img src="images/기본 연결/Group 1000014010 (3).png" alt="" class="connector conn-4-5" id="conn45">
        <img src="images/기본 연결/Group 1000014010 (5).png" alt="" class="connector conn-5-6" id="conn56">
        <img src="images/기본 연결/Group 1000014010 (2).png" alt="" class="connector conn-6-7" id="conn67">
        <img src="images/잠금/Group 1000014022.png" alt="1" class="lockBubble bubble1" id="lock1">
        <img src="images/잠금/Group 1000014023.png" alt="2" class="lockBubble bubble2" id="lock2">
        <img src="images/잠금/Group 1000014024.png" alt="3" class="lockBubble bubble3" id="lock3">
        <img src="images/잠금/Group 1000014025.png" alt="4" class="lockBubble bubble4" id="lock4">
        <img src="images/잠금/Group 1000014026.png" alt="5" class="lockBubble bubble5" id="lock5">
        <img src="images/잠금/Group 1000014021.png" alt="6" class="lockBubble bubble6" id="lock6">
        <img src="images/잠금/Group 1000014027.png" alt="7" class="lockBubble bubble7" id="lock7">
        <img src="images/Group 1000014462.png" alt="" class="selectRocket">
        <img src="images/제목 없음-3 2.png" alt="" class="stageRocket" id="stagerocket">
        <img src="images/Manual download.png" alt="매뉴얼 다운로드" class="selectManualBtn">
        <img src="images/Group 1000014248.png" alt="인증서 받기" class="certBtn cert1" id="cert1">
        <img src="images/Group 1000014248.png" alt="인증서 받기" class="certBtn cert2" id="cert2">
      </div>
    </div>
  </div>

  <script>
    function syncStartButtonWidth() {
      var manual = document.querySelector('.btnManual');
      var start = document.getElementById('btn-start');
      if (manual && start) {
        start.style.width = manual.offsetWidth + 'px';
      }
    }
    syncStartButtonWidth();
    window.addEventListener('resize', syncStartButtonWidth);

    document.getElementById('btn-start').addEventListener('click', function () {
      document.getElementById('page-main').hidden = true;
      document.getElementById('page-select').hidden = false;
    });

    var stages = {
      1: { lockId: 'lock1', lockGrey: 'images/잠금/Group 1000014022.png', lockYellow: 'images/잠금해제/Group 1000014039.png',
           connId: 'conn12', connGrey: 'images/기본 연결/Group 1000014010.png', connYellow: 'images/해제 연결/Group 1000014008.png',
           rocketClass: 'rocket-at-1' },
      2: { lockId: 'lock2', lockGrey: 'images/잠금 해제 기본/Group 1000014012.png', lockYellow: 'images/잠금해제/Group 1000014040.png',
           connId: 'conn23', connGrey: 'images/기본 연결/Group 1000014010 (1).png', connYellow: 'images/해제 연결/Group 1000014009.png',
           rocketClass: 'rocket-at-2' },
      3: { lockId: 'lock3', lockGrey: 'images/잠금 해제 기본/Group 1000014013.png', lockYellow: 'images/잠금해제/Group 1000014041.png',
           connId: 'conn34', connGrey: 'images/기본 연결/Group 1000014010 (4).png', connYellow: 'images/해제 연결/Group 1000013987.png',
           rocketClass: 'rocket-at-3' },
      4: { lockId: 'lock4', lockGrey: 'images/잠금 해제 기본/Group 1000014014.png', lockYellow: 'images/잠금해제/Group 1000014042.png',
           connId: 'conn45', connGrey: 'images/기본 연결/Group 1000014010 (3).png', connYellow: 'images/해제 연결/Group 1000013986.png',
           rocketClass: 'rocket-at-4' },
      5: { lockId: 'lock5', lockGrey: 'images/잠금 해제 기본/Group 1000014016.png', lockYellow: 'images/잠금해제/Group 1000014043.png',
           connId: 'conn56', connGrey: 'images/기본 연결/Group 1000014010 (5).png', connYellow: 'images/해제 연결/Group 1000013988.png',
           rocketClass: 'rocket-at-5' },
      6: { lockId: 'lock6', lockGrey: 'images/잠금 해제 기본/Group 1000014020.png', lockYellow: 'images/잠금해제/Group 1000014038.png',
           connId: 'conn67', connGrey: 'images/기본 연결/Group 1000014010 (2).png', connYellow: 'images/해제 연결/Group 1000013983.png',
           rocketClass: 'rocket-at-6' },
      7: { lockId: 'lock7', lockGrey: 'images/잠금 해제 기본/Group 1000014018.png', lockYellow: 'images/잠금해제/Group 1000014044.png',
           rocketClass: 'rocket-at-7', rocketSrc: 'images/Group 1000014461.png' }
    };
    var currentStage = null;

    function activateStage(n) {
      document.querySelector('.selectRocket').style.display = 'none';
      if (currentStage && stages[currentStage]) {
        var prev = stages[currentStage];
        var prevLock = document.getElementById(prev.lockId);
        prevLock.src = prev.lockGrey;
        prevLock.classList.remove('active');
        if (prev.connId) {
          var prevConn = document.getElementById(prev.connId);
          prevConn.src = prev.connGrey;
          prevConn.classList.remove('active');
        }
      }
      var s = stages[n];
      var lock = document.getElementById(s.lockId);
      lock.src = s.lockYellow;
      lock.classList.add('active');
      if (s.connId) {
        var conn = document.getElementById(s.connId);
        conn.src = s.connYellow;
        conn.classList.add('active');
      }
      var rocket = document.getElementById('stagerocket');
      rocket.src = s.rocketSrc || 'images/제목 없음-3 2.png';
      rocket.className = 'stageRocket active ' + s.rocketClass;
      currentStage = n;

      if (n === 3) { document.getElementById('cert1').src = 'images/Group 1000014248 (1).png'; }
      if (n === 7) { document.getElementById('cert2').src = 'images/Group 1000014249.png'; }

      var next = stages[n + 1];
      if (next) {
        document.getElementById(next.lockId).src = next.lockGrey;
      }
    }

    document.getElementById('lock1').addEventListener('click', function () { activateStage(1); });
    document.getElementById('lock2').addEventListener('click', function () { activateStage(2); });
    document.getElementById('lock3').addEventListener('click', function () { activateStage(3); });
    document.getElementById('lock4').addEventListener('click', function () { activateStage(4); });
    document.getElementById('lock5').addEventListener('click', function () { activateStage(5); });
    document.getElementById('lock6').addEventListener('click', function () { activateStage(6); });
    document.getElementById('lock7').addEventListener('click', function () { activateStage(7); });
  </script>
</body>
</html>
